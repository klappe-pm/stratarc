name: Bug report
description: Stratarc did something other than what the documentation says.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected and what happened instead.
      placeholder: "I ran `stratarc sync` and expected ..., but ..."
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the command output as text. Remove anything that looks like a credential.
      render: text
  - type: input
    id: version
    attributes:
      label: Stratarc version
      description: The output of `stratarc --version`.
    validations:
      required: true
  - type: input
    id: runtimes
    attributes:
      label: Runtimes and versions
      description: The runtimes involved and their versions, for example Claude Code 2.1.0.
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and Python version.
