name: drift

# Checks the source root alone: the reference graph, decision and plan records, and schema validation. Comparing checkouts against the control plane needs the checkouts, so that runs on the operator's Mac.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install stratarc
        run: pipx install stratarc==0.4.0
      - name: Schema validation
        run: stratarc validate
      - name: Source drift
        run: stratarc drift --source
